name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name
        if: github.event_name == 'pull_request'
        run: |
          echo "$GITHUB_HEAD_REF" | grep -Eq '^(frontend|backend|ai)/feature/[a-z0-9-]+$' || { echo "Branch must be <frontend|backend|ai>/feature/<name>"; exit 1; }
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$TITLE" | grep -Eq '^(feat|fix|chore|docs|test|refactor|ci|build)(\([a-z0-9-]+\))?: .+ \((FE|BE|AI|KAN)-[0-9]+\)$' || { echo "Title must look like: feat(core): add thing (BE-11)"; exit 1; }
  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Stub. Replaced by FE-21 / KAN-9."
  backend-ci:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Stub. Replaced by BE-9 / KAN-9."
  ai-ci:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Stub. Replaced by AI-7 / KAN-9."
  contracts:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Stub. Replaced by KAN-7 (schema validation)."
  renderer-parity:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Stub. Replaced by FE-33."
  security:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Stub. Add secret scanning and dependency audit in KAN-9."
  terraform:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Stub. Replaced by KAN-10."
