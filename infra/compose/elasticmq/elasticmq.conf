# ElasticMQ (SQS-compatible) configuration for local development.
#
# Source of truth for the numbers: docs/Design/Failure Handling Design.md §4.2
# and docs/Communication Contracts/SQS Event Contracts.md §2.1.1.
# They are drafts: change them here and in those docs together.
#
#   queue                 visibility  maxReceiveCount  DLQ
#   cv-extraction         5 min       3                cv-extraction-dlq
#   github-analysis       10 min      3                github-analysis-dlq
#   linkedin-extraction   5 min       3                linkedin-extraction-dlq
#   website-generation    10 min      3                website-generation-dlq
#   website-publishing    10 min      3                website-publishing-dlq
#   processing-results    1 min       5                processing-results-dlq
#
# Source queues keep the SQS default retention (4 days); DLQs keep 14 days.

include classpath("application.conf")

# "*" makes returned queue URLs use the Host header of the request, so the same
# server works for containers (http://elasticmq:9324) and the host (http://localhost:9324).
node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

aws {
  region = eu-central-1
  accountId = 000000000000
}

queues {
  cv-extraction {
    defaultVisibilityTimeout = 300 seconds
    deadLettersQueue { name = "cv-extraction-dlq", maxReceiveCount = 3 }
  }
  cv-extraction-dlq { messageRetentionPeriod = 14 days }

  github-analysis {
    defaultVisibilityTimeout = 600 seconds
    deadLettersQueue { name = "github-analysis-dlq", maxReceiveCount = 3 }
  }
  github-analysis-dlq { messageRetentionPeriod = 14 days }

  linkedin-extraction {
    defaultVisibilityTimeout = 300 seconds
    deadLettersQueue { name = "linkedin-extraction-dlq", maxReceiveCount = 3 }
  }
  linkedin-extraction-dlq { messageRetentionPeriod = 14 days }

  website-generation {
    defaultVisibilityTimeout = 600 seconds
    deadLettersQueue { name = "website-generation-dlq", maxReceiveCount = 3 }
  }
  website-generation-dlq { messageRetentionPeriod = 14 days }

  website-publishing {
    defaultVisibilityTimeout = 600 seconds
    deadLettersQueue { name = "website-publishing-dlq", maxReceiveCount = 3 }
  }
  website-publishing-dlq { messageRetentionPeriod = 14 days }

  processing-results {
    defaultVisibilityTimeout = 60 seconds
    deadLettersQueue { name = "processing-results-dlq", maxReceiveCount = 5 }
  }
  processing-results-dlq { messageRetentionPeriod = 14 days }
}
