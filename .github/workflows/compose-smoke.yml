# Starts the local Compose stack (KAN-8) and runs its smoke test.
#
# Path-filtered (KAN-9): the real work only runs when the paths below change, but the
# job named "compose-smoke" always runs and reports, so a required check never waits forever.
name: compose-smoke
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      # Pull requests: the filter asks the GitHub API for the changed files, no checkout needed.
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            run:
              - 'infra/compose/**'
              - 'scripts/dev.py'
              - 'Makefile'
              - '.env.example'
              - 'services/*/alembic.ini'
              - 'services/*/alembic/**'
              - '.github/workflows/compose-smoke.yml'
  smoke:
    name: compose-smoke (run)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: make up smoke
      - name: Container logs
        if: failure()
        run: |
          docker compose --env-file .env.example -f infra/compose/docker-compose.yml ps -a
          docker compose --env-file .env.example -f infra/compose/docker-compose.yml logs --no-color --tail 200
  compose-smoke:
    needs: [changes, smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Pass unless a job above failed (skipped counts as passed)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) echo "A required job failed."; exit 1 ;;
          esac
