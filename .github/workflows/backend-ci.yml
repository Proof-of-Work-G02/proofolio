# Backend checks: ruff, mypy, pytest.
#
# Path-filtered (KAN-9): the real work only runs when the paths below change, but the
# job named "backend-ci" always runs and reports, so a required check never waits forever.
name: backend-ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      # Pull requests: the filter asks the GitHub API for the changed files, no checkout needed.
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            run:
              - 'services/core-backend/**'
              - 'services/website-service/**'
              - 'services/_shared/python/**'
              - 'contracts/**'
              - 'scripts/dev.py'
              - '.env.example'
              - '.github/workflows/backend-ci.yml'
  run:
    name: backend-ci (run)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Core Backend and test tools
        run: python -m pip install ./services/_shared/python './services/core-backend[dev]'
      - name: Lint, type-check and test Core Backend
        run: python scripts/dev.py backend-test
  backend-ci:
    needs: [changes, run]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Pass unless a job above failed (skipped counts as passed)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) echo "A required job failed."; exit 1 ;;
          esac
